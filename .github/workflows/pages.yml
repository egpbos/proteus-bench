name: Dashboard
# A push to the results branch cannot start a workflow that exists only on
# main, so the dashboard rebuilds daily and on demand; `proteus-bench publish`
# dispatches it after pushing a record.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * *"
# One group for every trigger: all runs publish to the same github-pages
# environment, so the group is deliberately not scoped by ref.
concurrency:
  group: pages
  cancel-in-progress: false
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.results.outputs.exists }}
    steps:
      - name: Check that the results branch exists
        id: results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if answer=$(gh api "repos/$GITHUB_REPOSITORY/branches/results" --jq .name 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' <<< "$answer"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No results branch yet, so there is no dashboard to build. Publish a run first."
          else
            echo "::error::Could not check for the results branch: $answer"
            exit 1
          fi

  deploy:
    needs: check
    if: needs.check.outputs.exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # The code: main for the schedule and for a dispatch without --ref
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # The data, which publishers write: read as untrusted input, never executed
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: results
          path: results
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install .
      - run: proteus-bench report --store results --out site --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
