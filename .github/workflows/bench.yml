name: Benchmark
# Runs a suite on PROTEUS main every week, or on any PROTEUS ref by hand, and
# publishes the run to the results branch, a failed run too (its record says so).
on:
  schedule:
    - cron: "37 22 * * 6" # Saturday 22:37 UTC, outside the PROTEUS nightly (03:00 to 04:00)
  workflow_dispatch:
    inputs:
      suite:
        description: proteus-bench suite
        default: default
      ref:
        description: PROTEUS branch, tag or commit to measure
        default: main
      profiler:
        description: Profiler (a profiled run is not compared with other runs)
        type: choice
        options: [none, scalene, py-spy]
        default: none
# Runs publish to one store branch: one at a time, none cancelled
concurrency:
  group: bench
  cancel-in-progress: false
permissions: {}
jobs:
  run:
    runs-on: ubuntu-latest
    # Setup takes up to an hour on cold caches; the run is capped at 3 hours below
    timeout-minutes: 270
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -el {0}
    env:
      SUITE: ${{ inputs.suite || 'default' }}
      REF: ${{ inputs.ref || 'main' }}
      PROFILER: ${{ inputs.profiler || 'none' }}
    steps:
      # PROTEUS at the workspace root, where its setup action expects the checkout
      - uses: actions/checkout@v7
        with:
          repository: FormingWorlds/PROTEUS
          ref: ${{ env.REF }}
          fetch-depth: 0 # the record places the run on the history of origin/main
          persist-credentials: false
      - name: Check that the ref has the setup action
        run: |
          [ -f .github/actions/setup-proteus/action.yml ] || {
            echo "::error::PROTEUS $REF has no .github/actions/setup-proteus; refs from #678 (2026-06-09) on have it"
            exit 1
          }
      - uses: ./.github/actions/setup-proteus
        with:
          full-data: "true"
      - name: Install proteus-bench and the profiler
        run: |
          set -euo pipefail
          pip install -U "pip>=26.2.2" "certifi>=2026.10.19"
          pip install "proteus-bench @ git+https://github.com/$GITHUB_REPOSITORY@$GITHUB_SHA"
          case "$PROFILER" in
            scalene) pip install scalene==2.3.0 ;; # the version the recipe is written for
            py-spy) pip install py-spy ;;
          esac
      - name: "Patch a ref from before #983 to log the timing lines"
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: proteus-bench prepare HEAD
      - name: Run the suite
        run: >-
          proteus-bench run --suite "$SUITE" --profiler "$PROFILER"
          --runs-dir "$RUNNER_TEMP/bench-runs" --timeout 10800
      - name: Upload the run directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-run
          path: |
            ${{ runner.temp }}/bench-runs/
            !${{ runner.temp }}/bench-runs/*/output/**
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: run
    # A failed run is published as failed; a run that never started leaves no artifact
    if: always() && needs.run.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push to the results branch
      actions: write # dispatch the Dashboard workflow, which a token push cannot start
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bench-run
          path: bench-runs
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install proteus-bench
        run: |
          pip install -U "pip>=26.2.2" "certifi>=2026.10.19"
          pip install "proteus-bench[publish] @ git+https://github.com/$GITHUB_REPOSITORY@$GITHUB_SHA"
      - name: Publish the run
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          gh auth setup-git
          proteus-bench publish --remote "https://github.com/$GITHUB_REPOSITORY.git" bench-runs/*
