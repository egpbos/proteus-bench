name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every push to main is analysed
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Every tool comes from the pixi environments, the same ones
# developers use through `pixi run`.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # installing the package runs PR code
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.79.0
          manifest-path: pyproject.toml
          environments: default
      - run: pixi run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [py311, default, py313] # default is Python 3.12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # installing the package runs PR code
      - uses: prefix-dev/setup-pixi@v0
        with:
          pixi-version: v0.79.0
          manifest-path: pyproject.toml
          environments: ${{ matrix.environment }}
      - run: pixi run -e ${{ matrix.environment }} test --cov=proteus_bench --cov-report=xml --cov-report=term
      - run: pixi run -e ${{ matrix.environment }} proteus-bench validate examples/timing.jsonl examples/record.json
      - if: matrix.environment == 'default'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  sonarqube:
    name: SonarQube
    needs: test
    # Pull requests from forks get no secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # blame data, so Sonar can tell new code from old
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=egpbos
            -Dsonar.projectKey=egpbos_proteus-bench
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.11,3.12,3.13
            -Dsonar.python.coverage.reportPaths=coverage.xml
