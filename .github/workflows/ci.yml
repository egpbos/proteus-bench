name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov=proteus_bench --cov-report=xml --cov-report=term
      - run: proteus-bench validate examples/timing.jsonl examples/record.json
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # The harness is installed into PROTEUS environments, so it must work with no
  # dependencies at all: install without extras and run it.
  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      # Only proteus-bench itself may have been added to the fresh environment
      - run: test "$(pip list --format=freeze | grep -vciE '^(pip|setuptools|wheel|proteus-bench)==')" = 0
      - run: proteus-bench validate examples/timing.jsonl | tee out.txt && grep -q 'shape not checked' out.txt
