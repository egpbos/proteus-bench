name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  # Superseded PR pushes are cancelled; every push to main is analysed
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Every tool comes from the locked pixi environments (pixi.lock), the same ones
# developers use through `pixi run`; actions are pinned by commit.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.79.0
          manifest-path: pyproject.toml
          environments: default
      - run: pixi run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [py311, default, py313] # default is Python 3.12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.79.0
          manifest-path: pyproject.toml
          environments: ${{ matrix.environment }}
      - run: pixi run -e ${{ matrix.environment }} test --cov=proteus_bench --cov-report=xml --cov-report=term
      - run: pixi run -e ${{ matrix.environment }} proteus-bench validate examples/timing.jsonl examples/record.json
      - if: matrix.environment == 'default'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml

  sonarqube:
    name: SonarQube
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # blame data, so Sonar can tell new code from old
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=egpbos
            -Dsonar.projectKey=egpbos_proteus-bench
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.11,3.12,3.13
            -Dsonar.python.coverage.reportPaths=coverage.xml
