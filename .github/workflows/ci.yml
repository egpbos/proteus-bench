name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  # Superseded PR pushes are cancelled; every push to main is analysed
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov=proteus_bench --cov-report=xml --cov-report=term
      - run: proteus-bench validate examples/timing.jsonl examples/record.json
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  sonarqube:
    name: SonarQube
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # blame data, so Sonar can tell new code from old
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=egpbos
            -Dsonar.projectKey=egpbos_proteus-bench
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.11,3.12,3.13
            -Dsonar.python.coverage.reportPaths=coverage.xml

  # The harness is installed into PROTEUS environments, so it must work with no
  # dependencies at all: install without extras and run it.
  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      # Only proteus-bench itself may have been added to the fresh environment
      - run: test "$(pip list --format=freeze | grep -vciE '^(pip|setuptools|wheel|proteus-bench)==')" = 0
      - run: proteus-bench validate examples/timing.jsonl | tee out.txt && grep -q 'shape not checked' out.txt
