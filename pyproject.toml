[build-system]
requires = ["setuptools>=77"]  # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "proteus-bench"
description = "Benchmarking and profiling harness for the PROTEUS planet evolution framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
# Runs happen inside the PROTEUS environment, so tomli-w (the run config writer) is the
# one dependency; other commands get theirs from extras (AGENTS.md, architecture rule 1)
dependencies = ["tomli-w>=1"]

[project.optional-dependencies]
analysis = ["asv>=0.6.6,<0.7"]
report = [
    "jinja2>=3.1",
    "plotly>=7.1,<8",
    "proteus-plotly @ git+https://github.com/egpbos/proteus-visual-language@proteus-plotly#subdirectory=figures/proteus-plotly",
]
publish = ["jsonschema>=4.18", "rfc3339-validator"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-timeout>=2", "jsonschema>=4.18", "rfc3339-validator", "ruff>=0.16", "asv>=0.6.6,<0.7", "jinja2>=3.1", "plotly>=7.1,<8"]

[project.scripts]
proteus-bench = "proteus_bench.cli:main"

[tool.setuptools.dynamic]
version = { attr = "proteus_bench.__version__" }

[tool.setuptools.package-data]
"proteus_bench" = ["flame_template.html", "suites.toml"]
"proteus_bench.schemas" = ["*.json"]
"proteus_bench.report.templates" = ["*.css", "*.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "unit: fast tests without external programs (< 100 ms each)",
    "smoke: tests that need an external program or exceed the unit time budget",
]

[tool.coverage.run]
# coverage.xml is read by Sonar in another CI job, where absolute paths need not match
relative_files = true

[tool.ruff]
src = ["src"]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
# Style and correctness, plus complexity and bloat limits (see AGENTS.md, "Code quality")
select = [
    "F", "E", "W", "I",  # pyflakes, pycodestyle, isort
    "B",                 # bugbear
    "C90",               # McCabe complexity
    "ERA",               # commented-out code
    "PIE", "RET", "SIM", # redundant or convoluted constructs
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # too many returns, branches, arguments, statements
    "UP",                # pyupgrade
]
ignore = ["E501", "E741"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["proteus_bench"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "single"

# Development environment: `pixi run test`, `pixi run lint`
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
proteus-bench = { path = ".", editable = true, extras = ["dev"] }
# The report extra names proteus-plotly by its git branch; tests use the local clone
proteus-plotly = { path = "../../proteus-visual-language/figures/proteus-plotly", editable = true }

[tool.pixi.tasks]
test = "pytest"
lint = "ruff check src tests && ruff format --check src tests"

# One locked environment per supported Python; CI runs the tests in each
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.environments]
default = ["py312"]
py311 = ["py311"]
py313 = ["py313"]
