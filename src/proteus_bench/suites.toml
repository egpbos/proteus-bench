# Benchmark suites for `proteus-bench run --suite NAME`.
#
# config: PROTEUS config file, relative to the PROTEUS checkout being measured.
# overrides: dotted config keys replaced before the run.
# expected_backends: "<submodule>.<key>" = value, compared with the backend
#   events PROTEUS writes to timing.jsonl; a mismatch makes the run not comparable.

[suite.default]
config = "input/all_options.toml"
# all_options.toml runs up to 9000 iterations; the cap keeps a run within a CI job.
overrides = { "params.stop.iters.maximum" = 16 }
expected_backends = { "aragog.solver" = "cvode" }
