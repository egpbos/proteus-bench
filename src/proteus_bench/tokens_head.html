<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@formingworlds/proteus-tokens@1.3.0/tokens.css" integrity="sha384-4fqZF8VUXgYMIlRcwHP0fUt9ZXcaXQmMn60TgloL1H65VBOLDww3oCnf1z/CZ8LV" crossorigin="anonymous">
<script>{
  const light = matchMedia('(prefers-color-scheme: light)');
  const root = document.documentElement;
  (light.onchange = () => root.dataset.theme = light.matches ? 'light' : 'dark')();
}</script>
